<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Pagina non trovata — Miami 4.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F4EFE6;
      --ink: #1A1612;
      --ink-soft: #6B5F52;
      --gold: #A38454;
      --burgundy: #6E2A30;
      --rule: #D9CFBE;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      text-align: center;
      max-width: 480px;
    }
    .num {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.95rem;
      letter-spacing: .15em;
      color: var(--gold);
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 9vw, 4.5rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    h1 em {
      font-style: italic;
      color: var(--gold);
    }
    .lead {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--ink-soft);
      margin: 22px 0 32px;
      line-height: 1.55;
    }
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 22px auto;
      color: var(--gold);
    }
    .ornament::before, .ornament::after {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--gold);
      opacity: .6;
    }
    .ornament svg { width: 9px; height: 9px; fill: currentColor; }
    a.home {
      display: inline-block;
      padding: 14px 32px;
      background: var(--ink);
      color: var(--paper);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background .2s, color .2s, transform .2s;
    }
    a.home:hover {
      background: var(--gold);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="num">— 404 —</div>
    <h1><em>Pagina</em> smarrita</h1>
    <div class="ornament">
      <svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="2"/></svg>
    </div>
    <p class="lead">Sembra che questa pagina non sia presente nel nostro men&ugrave;. Torna alla home per ricominciare.</p>
    <a class="home" href="/">Torna alla Home</a>
  </div>
</body>
</html>
